# Render Blueprint — plain Node, no Docker. Render installs deps, builds the
# app, and runs the server that serves both the API and the frontend.
#
# Create a Render "Blueprint" from this repo and fill in the three values.
services:
  - type: web
    name: blocly-tools
    runtime: node
    plan: free
    # --include=dev guarantees build tools (vite, esbuild) install even if the
    # host sets NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production node dist/server.cjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Available at build time so Vite bakes them into the frontend.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_ADMIN_EMAIL
        sync: false
      # Used by server-side CORS. Set this to your deployed Render URL or custom domain.
      - key: APP_URL
        sync: false
